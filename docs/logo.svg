<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="sbox-rs logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e29"/>
      <stop offset="1" stop-color="#2d3447"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- isometric cube -->
  <polygon points="128,48 197,88 128,128 59,88" fill="url(#top)"/>
  <polygon points="197,88 197,168 128,208 128,128" fill="#e0561f"/>
  <polygon points="59,88 128,128 128,208 59,168" fill="#a93410"/>
  <!-- wgpu-style highlight edge -->
  <polyline points="59,88 128,128 197,88" fill="none" stroke="#fff3df" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
  <line x1="128" y1="128" x2="128" y2="208" stroke="#fff3df" stroke-opacity=".35" stroke-width="2"/>
